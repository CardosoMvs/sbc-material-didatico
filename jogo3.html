<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Alta Pressão SBC</title>
    <link rel="stylesheet" href="estilo-sbc.css">
    <style>
        .tempo-barra { height: 10px; background: #dde6dd; border: 2px solid #cfdccf; border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
        .tempo-preenchimento {
            height: 100%;
            border-radius: 999px;
            background: var(--verde);
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.25) 0 8px, rgba(255,255,255,0) 8px 16px);
            background-size: 22.6px 22.6px;
            animation: listras 0.7s linear infinite;
            transition: width 0.3s linear;
        }

        .dificuldade {
            display: inline-block;
            font-size: 0.72em;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 3px 12px;
            border-radius: 999px;
            margin-bottom: 10px;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
            transform: rotate(-2deg);
        }
        .dificuldade.f { background: var(--verde-claro); color: var(--verde-escuro); border: 2px solid var(--verde); }
        .dificuldade.m { background: var(--dourado-claro); color: #8a6d0b; border: 2px solid var(--dourado); }
        .dificuldade.d { background: var(--carmim-claro); color: var(--carmim); border: 2px solid var(--carmim); }

        .barra-ajuda { display: flex; justify-content: center; margin: 4px 0 10px; }
        .btn-5050 {
            background: var(--dourado-claro);
            border: 2px solid var(--dourado);
            color: #8a6d0b;
            font-weight: 900;
            border-radius: 999px;
            padding: 8px 20px;
            font-family: inherit;
            font-size: 0.95em;
            cursor: pointer;
            box-shadow: 0 4px 0 #b3820a;
            transition: transform 0.08s, box-shadow 0.08s;
        }
        .btn-5050:active { transform: translateY(4px); box-shadow: 0 0 0 #b3820a; }
        .btn-5050:disabled { opacity: 0.35; cursor: default; box-shadow: 0 4px 0 #d8c58f; }

        .resumo-dif { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .resumo-dif td { padding: 8px 10px; border-bottom: 2px solid #dfe8df; font-size: 0.95em; }
        .resumo-dif td:last-child { text-align: right; font-weight: 900; color: var(--azul); white-space: nowrap; }
        .pulos { animation: pulsar 0.4s ease; }
        @keyframes pulsar { 50% { transform: scale(1.3); } }
    </style>
</head>
<body>

    <header class="topo">
        <a href="index.html" class="voltar" aria-label="Voltar ao menu">←</a>
        <div class="titulo-bloco">
            <span class="selo">SBC · Soja Baixo Carbono</span>
            <h1 class="titulo">Quiz Alta Pressão</h1>
        </div>
    </header>

    <div class="placar" id="cabecalho-jogo">
        <div class="placar-item">
            <div class="valor" id="pontos">0</div>
            <div class="nome">Pontos</div>
        </div>
        <div class="placar-item">
            <div class="valor" id="streak">🔥 ×1</div>
            <div class="nome">Multiplicador</div>
        </div>
        <div class="placar-item">
            <div class="valor" id="progresso">1/8</div>
            <div class="nome">Pergunta</div>
        </div>
    </div>

    <main class="cartao" id="area-quiz">
        <span class="dificuldade f" id="dif-chip">Fácil · 100 pts</span>
        <div class="tempo-barra"><div class="tempo-preenchimento" id="tempo-barra" style="width:100%;"></div></div>
        <div id="pergunta-texto" style="font-size:1.12em;font-weight:700;line-height:1.4;margin-bottom:14px;">Carregando...</div>
        <div class="barra-ajuda"><button class="btn-5050" id="btn-5050" onclick="usar5050()">💡 Ajuda 50/50</button></div>
        <div id="opcoes"></div>
        <div class="feedback" id="feedback"></div>
        <button class="botao secundario oculto" id="btn-proxima" onclick="proxima()" style="margin-top:12px;">Próxima pergunta ➜</button>
    </main>

    <main class="cartao tela-final oculto" id="area-final">
        <div class="trofeu" id="trofeu">🏆</div>
        <h2 id="final-titulo">Fim de jogo!</h2>
        <p style="font-size:1.1em;">Sua pontuação: <strong id="final-pontos" style="color:var(--azul)">0</strong></p>
        <p class="sub" id="final-msg"></p>
        <div style="text-align:left;margin-top:8px;">
            <h2 style="font-size:1em;">Desempenho por dificuldade</h2>
            <table class="resumo-dif" id="tabela-dif"></table>
        </div>
        <section style="margin-top:14px;text-align:left;">
            <h2 style="font-size:1em;">🏅 Top produtores do estande</h2>
            <ul class="lista-ranking" id="ranking"></ul>
        </section>
        <button class="botao" onclick="location.reload()">Jogar de novo</button>
        <a href="index.html" class="botao neutro" style="text-decoration:none;text-align:center;">Voltar ao menu</a>
    </main>

    <footer class="rodape">
        Programa SBC – Soja Baixo Carbono · Embrapa Soja
    </footer>

    <script src="jogos-sbc.js"></script>
    <script>
        "use strict";

        // Banco de 20 perguntas (Comunicado Técnico 100 + Folder SBC).
        // f = fácil (100), m = média (150), d = difícil (250).
        var PERGUNTAS = [
            { dif: "f", q: "Quantas toneladas de CO₂eq por hectare o SPD imobiliza por ano?", opcoes: ["1 tonelada", "3 toneladas", "10 toneladas"], resp: 1,
              exp: "3 t CO₂eq/ha·ano — 60 toneladas ao longo de 20 anos (Embrapa)." },
            { dif: "f", q: "A eliminação da adubação nitrogenada química na soja reduz a emissão de qual gás?", opcoes: ["Óxido nitroso (N₂O)", "Metano (CH₄)", "Vapor d'água"], resp: 0,
              exp: "N₂O tem potencial de aquecimento global 298× maior que o CO₂. A FBN elimina essa fonte." },
            { dif: "f", q: "Quais bactérias formam a coinoculação recomendada para a soja?", opcoes: ["Bradyrhizobium + Azospirillum", "Rhizobium + Pseudomonas", "Azotobacter + Bacillus"], resp: 0,
              exp: "Bradyrhizobium + Azospirillum — a coinoculação aumenta a eficiência da FBN." },
            { dif: "f", q: "Qual instituição lidera o Programa SBC?", opcoes: ["Embrapa Soja", "IAC de Campinas", "UFV de Viçosa"], resp: 0,
              exp: "A Embrapa Soja (Londrina, PR) lidera, com 7 empresas apoiadoras." },
            { dif: "f", q: "O Manejo Integrado de Pragas reduz emissões principalmente porque…", opcoes: ["Reduz o trânsito de máquinas e a queima de combustíveis fósseis", "Usa inseticidas biológicos mais caros", "Aumenta o uso de fertilizantes"], resp: 0,
              exp: "Aplicar só quando necessário = menos aplicações e menos diesel queimado." },
            { dif: "f", q: "Quais são as premissas básicas do Sistema Plantio Direto?", opcoes: ["Revololvimento mínimo, rotação e diversificação de culturas", "Arado, grade e niveladora", "Irrigação, adubação foliar e semente certificada"], resp: 0,
              exp: "Sem revolvimento mínimo + rotação + diversificação, não é SPD pleno." },
            { dif: "f", q: "A Integração Lavoura-Pecuária-Floresta envolve quais componentes?", opcoes: ["Lavoura, pecuária e floresta", "Lavoura, indústria e comércio", "Pecuária, pesca e aquicultura"], resp: 0,
              exp: "ILPF: o componente arbóreo sequestra CO₂ e diversifica a renda." },
            { dif: "f", q: "Aplicar produto químico só quando necessário é exemplo de…", opcoes: ["Manejo integrado", "Plantio convencional", "Adubação de cobertura"], resp: 0,
              exp: "Manejos integrados de pragas, doenças e plantas daninhas: monitorar antes de aplicar." },
            { dif: "m", q: "Qual o potencial estimado de redução das emissões de GEEs ao adotar as tecnologias sustentáveis da pesquisa?", opcoes: ["~10%", "~30%", "~70%"], resp: 1,
              exp: "O Programa SBC estima ~30% — e com o uso integrado completo, pelo menos 50%." },
            { dif: "m", q: "Com o uso integrado de todas as tecnologias, a redução de emissões pode ser de pelo menos…", opcoes: ["30%", "50%", "75%"], resp: 1,
              exp: "Pelo menos 50% quando as tecnologias são adotadas em conjunto." },
            { dif: "m", q: "O conceito central do selo SBC mede as emissões em qual unidade?", opcoes: ["kg CO₂eq por tonelada de grãos", "t CO₂eq por hectare", "kg de insumos por saca"], resp: 0,
              exp: "É o IEGEE: kg CO₂eq/t de grãos, comparado a um baseline regional." },
            { dif: "m", q: "O que significa o sistema de controle MRV?", opcoes: ["Mensurável, Reportável e Verificável", "Máquinas, Rotas e Veículos", "Monitoramento, Rotação e Variedade"], resp: 0,
              exp: "MRV: critério internacional para certificações sérias de carbono." },
            { dif: "m", q: "No ciclo simplificado do carbono, quanto do CO₂ fotossintetizado fica retido no solo?", opcoes: ["10% a 20%", "40% a 50%", "80% a 90%"], resp: 0,
              exp: "80–90% volta à atmosfera na decomposição; 10–20% fica no solo como matéria orgânica." },
            { dif: "m", q: "Quanto do CO₂ retirado pela fotossíntese retorna à atmosfera na decomposição?", opcoes: ["80% a 90%", "30% a 40%", "100%"], resp: 0,
              exp: "80–90% retorna à atmosfera — e por isso manter matéria orgânica no solo é decisivo." },
            { dif: "m", q: "A adubação e correção de solo impactam principalmente…", opcoes: ["O teor de carbono orgânico do solo", "A cor dos grãos", "O preço de venda da soja"], resp: 0,
              exp: "Boas práticas de adubação melhoram o carbono orgânico do solo e o balanço de GEEs." },
            { dif: "m", q: "A certificação SBC é…", opcoes: ["Voluntária, aplicada por empresa especializada de 3ª parte", "Obrigatória para vender soja", "Feita pela própria cooperativa"], resp: 0,
              exp: "Adesão voluntária, protocolo com base científica e certificação de 3ª parte." },
            { dif: "d", q: "Com SPD pleno em toda a área de soja do Brasil, as emissões mitigadas equivaleriam às de quantos brasileiros por ano?", opcoes: ["1 milhão", "10 milhões", "50 milhões"], resp: 1,
              exp: "10 milhões de brasileiros/ano — os ~40 mi ha de soja em SPD pleno." },
            { dif: "d", q: "Qual é aproximadamente a área cultivada com soja no Brasil?", opcoes: ["~10 milhões de hectares", "~40 milhões de hectares", "~80 milhões de hectares"], resp: 1,
              exp: "Cerca de 40 milhões de hectares (safra 2020/21)." },
            { dif: "d", q: "Qual o potencial de aquecimento global (PAG) do óxido nitroso, segundo o IPCC 2006?", opcoes: ["298× o CO₂", "28× o CO₂", "56× o CO₂"], resp: 0,
              exp: "N₂O = 298×; o metano = 28×. Por isso cada kg de N₂O conta muito no IEGEE." },
            { dif: "d", q: "A construção do protocolo de certificação SBC segue o Código de Boas Práticas de qual entidade?", opcoes: ["ISEAL Alliance", "FAO", "ISO 9001"], resp: 0,
              exp: "ISEAL Alliance: código internacional de boas práticas para sistemas de certificação." }
        ];

        var TOTAL = 8;                       // 3 fáceis + 3 médias + 2 difíceis
        var PONTOS_DIF = { f: 100, m: 150, d: 250 };
        var NOME_DIF = { f: "Fácil", m: "Média", d: "Difícil" };
        var TEMPO = 15;

        var selecionadas = [];
        var indice = 0;
        var pontos = 0;
        var sequencia = 0;
        var respondida = false;
        var ajudaRestante = 1;
        var intervalo = null;
        var tempoRestante = TEMPO;
        var acertosPorDif = { f: 0, m: 0, d: 0 };
        var totalPorDif = { f: 0, m: 0, d: 0 };

        function atualizarPlacar() {
            document.getElementById("pontos").textContent = pontos;
            var mult = multiplicador();
            document.getElementById("streak").textContent = "🔥 ×" + mult;
        }

        function multiplicador() {
            if (sequencia >= 5) return 2;
            if (sequencia >= 3) return 1.5;
            return 1;
        }

        function iniciar() {
            var porDif = function (d) {
                return SBCH.embaralhar(PERGUNTAS.filter(function (p) { return p.dif === d; }));
            };
            selecionadas = porDif("f").slice(0, 3)
                .concat(porDif("m").slice(0, 3))
                .concat(porDif("d").slice(0, 2));
            carregarPergunta();
        }

        function carregarPergunta() {
            respondida = false;
            var p = selecionadas[indice];
            totalPorDif[p.dif] = totalPorDif[p.dif] || 0;
            atualizarPlacar();
            document.getElementById("progresso").textContent = (indice + 1) + "/" + TOTAL;

            var chip = document.getElementById("dif-chip");
            chip.textContent = NOME_DIF[p.dif] + " · " + PONTOS_DIF[p.dif] + " pts";
            chip.className = "dificuldade " + p.dif;

            document.getElementById("pergunta-texto").textContent = p.q;
            document.getElementById("feedback").className = "feedback";
            document.getElementById("btn-proxima").classList.add("oculto");
            var btnAjuda = document.getElementById("btn-5050");
            btnAjuda.disabled = ajudaRestante <= 0;
            btnAjuda.textContent = ajudaRestante > 0 ? "💡 Ajuda 50/50" : "💡 Ajuda usada";

            var area = document.getElementById("opcoes");
            area.innerHTML = "";
            var ordem = SBCH.embaralhar([0, 1, 2]);
            ordem.forEach(function (realIdx) {
                var b = document.createElement("button");
                b.className = "opcao";
                b.textContent = p.opcoes[realIdx];
                b.dataset.real = realIdx;
                b.onclick = function () { responder(realIdx, b); };
                area.appendChild(b);
            });

            iniciarTimer();
        }

        function iniciarTimer() {
            clearInterval(intervalo);
            tempoRestante = TEMPO;
            var barra = document.getElementById("tempo-barra");
            barra.style.width = "100%";
            barra.style.background = "var(--verde)";
            intervalo = setInterval(function () {
                tempoRestante--;
                var f = tempoRestante / TEMPO;
                barra.style.width = (f * 100) + "%";
                barra.style.background = f > 0.4 ? "var(--verde)" : (f > 0.2 ? "var(--dourado)" : "var(--carmim)");
                if (tempoRestante <= 0) {
                    clearInterval(intervalo);
                    responder(-1, null);
                }
            }, 1000);
        }

        function usar5050() {
            if (ajudaRestante <= 0 || respondida) return;
            ajudaRestante--;
            respondida = false;
            var p = selecionadas[indice];
            var erradas = Array.from(document.querySelectorAll("#opcoes .opcao")).filter(function (b) {
                return parseInt(b.dataset.real, 10) !== p.resp;
            });
            // remove erradas até sobrar 2 botões (a certa + 1 errada)
            var paraRemover = erradas.length - 1;
            SBCH.embaralhar(erradas).slice(0, paraRemover).forEach(function (b) {
                b.disabled = true;
                b.style.opacity = "0.25";
                b.style.textDecoration = "line-through";
            });
            var btn = document.getElementById("btn-5050");
            btn.disabled = true;
            btn.textContent = "💡 Ajuda usada";
            SBCH.som("acerto");
        }

        function responder(escolha, botao) {
            if (respondida) return;
            respondida = true;
            clearInterval(intervalo);

            var p = selecionadas[indice];
            var acertou = escolha === p.resp;
            var fb = document.getElementById("feedback");

            var botoes = document.querySelectorAll("#opcoes .opcao");
            botoes.forEach(function (b, i) {
                b.disabled = true;
                if (parseInt(b.dataset.real, 10) === p.resp) b.classList.add("certa");
            });
            if (escolha !== -1 && !acertou && botao) botao.classList.add("errada");

            var base = PONTOS_DIF[p.dif];
            if (acertou) {
                sequencia++;
                acertosPorDif[p.dif]++;
                var ganho = Math.round((base + tempoRestante * 10) * multiplicador());
                pontos += ganho;
                SBCH.popupPontos(document.getElementById("pontos"), "+" + ganho);
                fb.className = "feedback ok";
                fb.innerHTML = "<strong>✔ Correto! +" + ganho + " pts" +
                    (multiplicador() > 1 ? " (🔥 ×" + multiplicador() + ")" : "") + "</strong><br>" + p.exp;
                SBCH.som("acerto");
                var st = document.getElementById("streak");
                st.classList.remove("pulos"); void st.offsetWidth; st.classList.add("pulos");
                if (sequencia >= 3) SBCH.confete();
            } else {
                sequencia = 0;
                fb.className = "feedback erro";
                fb.innerHTML = "<strong>" + (escolha === -1 ? "⏰ Tempo esgotado!" : "✖ Resposta errada.") + "</strong><br>" + p.exp;
                SBCH.som("erro");
            }

            atualizarPlacar();
            var prox = document.getElementById("btn-proxima");
            prox.classList.remove("oculto");
            prox.textContent = indice < TOTAL - 1 ? "Próxima pergunta ➜" : "Ver resultado 🏁";
        }

        function proxima() {
            indice++;
            if (indice < TOTAL) carregarPergunta();
            else finalizar();
        }

        function finalizar() {
            document.getElementById("cabecalho-jogo").classList.add("oculto");
            document.getElementById("area-quiz").classList.add("oculto");
            document.getElementById("area-final").classList.remove("oculto");
            document.getElementById("final-pontos").textContent = pontos;

            var totalAcertos = acertosPorDif.f + acertosPorDif.m + acertosPorDif.d;
            if (pontos >= 1500) { document.getElementById("trofeu").textContent = "🏆"; document.getElementById("final-titulo").textContent = "Nível consultor Embrapa!"; }
            else if (pontos >= 1000) { document.getElementById("trofeu").textContent = "🥈"; document.getElementById("final-titulo").textContent = "Nível produtor SBC!"; }
            else { document.getElementById("trofeu").textContent = "🌱"; document.getElementById("final-titulo").textContent = "Bom começo!"; }
            document.getElementById("final-msg").textContent =
                "Você acertou " + totalAcertos + " de " + TOTAL + " perguntas. O quiz sorteia 8 de um banco de 20 — jogue de novo e venha perguntas novas!";

            var tabela = document.getElementById("tabela-dif");
            tabela.innerHTML = "";
            ["f", "m", "d"].forEach(function (d) {
                var tr = document.createElement("tr");
                tr.innerHTML = "<td>" + NOME_DIF[d] + " (" + PONTOS_DIF[d] + " pts)</td><td>" +
                    acertosPorDif[d] + "/" + totalPorDif[d] + "</td>";
                tabela.appendChild(tr);
            });

            SBCH.desenharRanking(document.getElementById("ranking"), "quiz", " pts");
            SBCH.pedirNomeESalvar("quiz", pontos, true, function () {
                SBCH.desenharRanking(document.getElementById("ranking"), "quiz", " pts");
            });
            SBCH.confete();
            SBCH.som("vitoria");
        }

        iniciar();
    </script>
</body>
</html>
